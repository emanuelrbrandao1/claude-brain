[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-brain"
version = "0.2.0"
description = "Memória de longo prazo para o Claude Code num vault Markdown"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["markdown>=3.5", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
keyring = ["keyring>=24"]

[tool.setuptools]
# Scripts e hooks rodam direto do clone (ver README); não há pacote a instalar.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/e2e usa o Claude Code de verdade (custa dinheiro): fica fora da coleta padrão e da CI
addopts = "--ignore=tests/e2e"
markers = ["retentar_autosave_de_verdade: não desliga a chamada da rotina ao autosave --pendentes"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["scripts", "hooks", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["autosave", "claude_cmd", "comum", "conversa", "enviar_email", "foco", "grafico",
                     "notificar", "privacidade", "retomada", "rotina", "vault"]
